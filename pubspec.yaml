name: ramadan
description: E-Ramadan App

publish_to: 'none' 


version: 1.0.6+1060

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management & architecture
  get: ^4.7.3
  flutter_riverpod: ^2.6.1
  get_it: ^8.0.3
  go_router: ^14.8.1

  #Firebasess
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  firebase_analytics: ^12.6.0
  firebase_core_platform_interface: ^8.1.1
  firebase_auth: ^6.7.0
  google_sign_in: ^7.1.1
  firebase_remote_config: ^6.7.0
  firebase_performance: ^0.11.6

  #Maps
  permission_handler: ^13.0.2
  latlong2: ^0.10.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # Network
  intl: ^0.20.2
  http: ^1.0.0
  html: ^0.15.6

  #UI Operations
  lottie: ^3.3.1
  flutter_screenutil: ^5.9.0
  kartal: ^4.1.0
  easy_logger: ^0.0.2
  logger: ^2.0.2+1
  animated_text_kit: ^4.2.2
  intro_slider: ^4.2.1
  hexcolor: ^3.0.1
  another_flushbar: ^2.2.4
  flutter_svg: ^2.0.7

  #Other
  cupertino_icons: ^1.0.6
  google_fonts: ^8.2.1
  flutter_local_notifications: ^19.5.0

  #Database
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^7.0.0


flutter:
  uses-material-design: true
  assets:
    - assets/lottie/
    - assets/lottie/splash_slider_lottie/
    - assets/lottie/splash/
    - assets/image/login/
    - assets/image/home/
    - assets/image/hadith/
    - assets/json/hadiths.json

